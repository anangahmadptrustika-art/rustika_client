# Rustika Client — self-hosted stack.
#   docker compose --profile tunnel up -d --build   # di balik NAT (Cloudflare Tunnel)
#   docker compose --profile caddy  up -d --build   # IP publik + port 80/443 (Caddy, HTTPS otomatis)
#   docker compose up -d --build                    # app saja (kamu pasang reverse proxy sendiri)
# Semua nilai ${VAR} dibaca dari file .env di folder ini (lihat .env.server.example).

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    image: rustika-client:latest
    container_name: rustika-client
    restart: unless-stopped
    env_file: .env
    # Hanya terbuka ke localhost; Caddy / cloudflared yang menghadap internet.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Opsi A — Cloudflare Tunnel (server di balik NAT/rumah/kantor, tanpa buka port).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: rustika-cloudflared
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy

  # Opsi B — Caddy (IP publik, port 80/443 terbuka, DNS A record ke server).
  caddy:
    image: caddy:2
    container_name: rustika-caddy
    profiles: ["caddy"]
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
